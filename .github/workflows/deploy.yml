name: Deploy Nuxt to GitHub Pages

on:
  push:
    branches:
      - main # Cambia a 'master' si esa es tu rama principal

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Inyecta la URL base con el nombre exacto de tu repositorio
      - name: Create .env file
        run: |
          echo "NUXT_APP_BASE_URL=/PokeCollectorApp/" >> .env

      # Genera los archivos HTML estáticos en .output/public
      - name: Generate static site
        run: npx nuxi generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4